 <!-- 🔍 ค้นหา -->

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// ======= ใส่ค่าของคุณตรงนี้ =======
const SUPABASE_URL = "https://qasuckitplvdnghjvajy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KZ4eAHfXbNcFvL-Dbn2UuQ_v-NdJriJ";
// ==================================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const historyTab = document.getElementById("historyTab");
const tabForm = document.getElementById("tabForm");
const tabHistory = document.getElementById("tabHistory");
const tabIndicator = document.getElementById("tabIndicator");

let editingId = null;
let carURL = "";
let billURL = "";

// ===== Upload รูปไป Supabase Storage =====
async function uploadImage(file, folder) {
  const fileName = `${Date.now()}_${file.name}`;
  const { error } = await supabase.storage
    .from("garage")
    .upload(`${folder}/${fileName}`, file);

  if (error) {
    alert("อัปโหลดรูปไม่สำเร็จ: " + error.message);
    throw error;
  }

  const { data } = supabase.storage
    .from("garage")
    .getPublicUrl(`${folder}/${fileName}`);

  return data.publicUrl;
}

carImage.onchange = ()=>{
  const file = carImage.files[0];
  if(!file) return;
  carPreview.src = URL.createObjectURL(file);
  removeCar.style.display='flex';
};

billImage.onchange = ()=>{
  const file = billImage.files[0];
  if(!file) return;
  billPreview.src = URL.createObjectURL(file);
  removeBill.style.display='flex';
};

removeCar.onclick = ()=>{
  carImage.value="";
  carPreview.src="";
  removeCar.style.display='none';
  carURL="";
};

removeBill.onclick = ()=>{
  billImage.value="";
  billPreview.src="";
  removeBill.style.display='none';
  billURL="";
};

window.resetForm = function(){
  name.value="";
  date.value="";
  plate.value="";
  phone.value="";
  brand.value="";
  model.innerHTML='<option value="">เลือกรุ่น</option>';
  year.value="";
  beforeDetail.value="";
  afterDetail.value="";
  price.value="";
  carPreview.src="";
  billPreview.src="";
  removeCar.style.display='none';
  removeBill.style.display='none';
  editingId=null;
};

window.saveData = async ()=>{
  try{
    if(!name.value){
      alert("กรุณากรอกชื่อลูกค้า");
      return;
    }

    const carFile = carImage.files[0];
    const billFile = billImage.files[0];

    if(carFile){
  const compressedCar = await compressImage(carFile);
  carURL = await uploadImage(compressedCar, "cars");
}
    if(billFile){
  const compressedBill = await compressImage(billFile);
  billURL = await uploadImage(compressedBill, "bills");
}

const data = {
  name: name.value,
  date: date.value,
  plate: plate.value,
  phone: phone.value,
  brand: brand.value,
  model: model.value,
  year: year.value,
  beforedetail: beforeDetail.value,
  afterdetail: afterDetail.value,
  price: price.value,
  carimage: carURL,
  billimage: billURL,
  status: document.querySelector('input[name="status"]:checked')?.value || "กำลังซ่อม",
  createdat: new Date().toISOString()
};

    if(editingId){
      await supabase.from("jobs").update(data).eq("id", editingId);
      editingId=null;
    }else{
      await supabase.from("jobs").insert([data]);
    }

    alert("บันทึกสำเร็จ");
    showTab('history');

  }catch(error){
    console.error(error);
  }
};

window.loadHistory = async (keyword = "", selectedDate = "") => {

console.log("keyword:", keyword);
console.log("selectedDate:", selectedDate);

  let query = supabase
    .from("jobs")
    .select("*")
    .order("createdat", { ascending: false });


if (selectedDate) {
  query = query.eq("date", selectedDate);
}

  if (keyword) {
    query = query.or(
      `name.ilike.%${keyword}%,plate.ilike.%${keyword}%`
    );
  }

  const { data, error } = await query;

console.log("DATA:", data);
console.log("ERROR:", error);

if (error) {
  console.error(error);
  historyList.innerHTML = "โหลดข้อมูลไม่สำเร็จ";
  return;
}

  let html = "";
  let total = 0;

data?.forEach(i => {

  const itemPrice = parseFloat(i.price) || 0;
  total += itemPrice;

let statusColor = "#2196f3"; // default น้ำเงิน

if (i.status === "กำลังซ่อม") statusColor = "#ff9800";     // ส้ม
if (i.status === "เสร็จแล้ว") statusColor = "#2196f3";        // ฟ้า
if (i.status === "ยังไม่จ่าย") statusColor = "#f44336";  // แดง
if (i.status === "จ่ายแล้ว") statusColor = "#2e7d32";    // เขียวเข้ม

  html += `
<div style="
  background:#fff;
  padding:16px;

           0 4px 14px rgba(0,0,0,.06);

">

    <div style="

  gap:16px;
  align-items:flex-start;
">

      ${i.carimage ? `

loading="lazy"

">

      <i class="bi bi-cash-coin"></i>

    i.date ? new Date(i.date).toLocaleDateString("th-TH") : '-'
  }
    </div>
  </div>


<!-- แถวล่าง -->
<div style="
  margin-top:14px;

  align-items:center;
  gap:10px;
">

  <!-- สถานะ (ซ้าย) -->
  <div>
    <span style="
  background:${statusColor};
  color:#fff;
  padding:8px 18px;
  border-radius:20px;
  font-size:14px;
  font-weight:600;

function showTab(tab){
  formTab.style.display = tab==='form'?'block':'none';
  historyTab.style.display = tab==='history'?'block':'none';
  tabForm.classList.remove('active');
  tabHistory.classList.remove('active');
  if(tab==='form'){
    tabForm.classList.add('active');
    tabIndicator.style.transform='translateX(0%)';
  }else{
    tabHistory.classList.add('active');
    tabIndicator.style.transform='translateX(100%)';
    loadHistory(currentKeyword, currentDate);
  }
}

const modalImg = document.getElementById("modalImg");
  

modalImg.addEventListener("wheel", (e)=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(.8, scale), 4);
  modalImg.style.transform = `scale(${scale})`;
});

let initialDistance = 0;

modalImg.addEventListener("touchstart", (e)=>{
  if(e.touches.length === 2){
    initialDistance = getDistance(e.touches);
  }
});

modalImg.addEventListener("touchmove", (e)=>{
  if(e.touches.length === 2){
    e.preventDefault();

    const newDistance = getDistance(e.touches);
    let zoomFactor = newDistance / initialDistance;

    scale *= zoomFactor;
    scale = Math.min(Math.max(scale, .8), 4);
    initialDistance = newDistance;
    modalImg.style.transform = `scale(${scale})`;
  }
});

function getDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
} 

async function compressImage(file, maxWidth = 800, quality = 0.6) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = e => img.src = e.target.result;
    reader.readAsDataURL(file);

    img.onload = () => {
      let width = img.width;
      let height = img.height;

      if (width > maxWidth) {
        const scale = maxWidth / width;
        width = maxWidth;
        height = height * scale;
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob(
        blob => resolve(new File([blob], file.name, { type: "image/jpeg" })),
        "image/jpeg",
        quality
      );
    };
  });
}
