<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Test</title>

  <!-- Supabase CDN (ต้องมีบรรทัดนี้ก่อนใช้ createClient) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Supabase Connected ✅</h2>

  <script>
    // ดึง createClient จาก window.supabase
    const { createClient } = window.supabase;

    const SUPABASE_URL = "https://qasuckitplvdnghjvajy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KZ4eAHfXbNcFvL-Dbn2UuQ_v-NdJriJ";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ทดสอบเชื่อมต่อ
    async function testConnection() {
      const { data, error } = await supabase.from('jobs').select('*').limit(1);

      if (error) {
        console.error('Connection error:', error);
      } else {
        console.log('Connected successfully:', data);
      }
    }

    testConnection();
  </script>
</body>
</html>
